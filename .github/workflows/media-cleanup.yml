name: Media Expiry Cleanup

# This workflow cleans up expired ephemeral media files
# Used for chat attachments that have a 30-day retention policy
#
# Required GitHub Variables (set in repo Settings > Variables > Actions):
# - CRON_ENDPOINT: Base URL of the deployed application (e.g., https://your-app.vercel.app)
#
# Required GitHub Secrets (set in repo Settings > Secrets > Actions):
# - CRON_SECRET: Secret token for authenticating cron requests (must match CRON_SECRET env var)

on:
  schedule:
    # Run daily at 4 AM UTC (spread from 2 AM to reduce contention)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRON_ENDPOINT: ${{ vars.CRON_ENDPOINT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call cleanup endpoint
        run: |
          if [ -z "$CRON_ENDPOINT" ]; then
            echo "Error: CRON_ENDPOINT variable is not set. Please configure it in GitHub Actions repository variables."
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$CRON_ENDPOINT/api/cron/media-expiry" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" -ne 200 ]; then
            echo "Cleanup request failed with status $http_code"
            exit 1
          fi

          echo "Cleanup completed successfully"
