name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        type: boolean
        default: false
        description: 'Run E2E tests (triggered by Inspector)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/test' }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify DATABASE_URL is set
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL is set: true"
          else
            echo "DATABASE_URL is set: false"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high || true # npm retired the audit endpoint as of 2025

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting with Prettier
        run: pnpm format:check

      - name: Run unit tests
        run: pnpm test:unit -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 3

      - name: Check for TODO/FIXME in production code
        run: |
          if grep -r "TODO\|FIXME" src/ --exclude-dir=node_modules --exclude-dir=.next 2>/dev/null; then
            echo "⚠️  Found TODO/FIXME comments in production code"
          fi
        continue-on-error: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [fast-gate]
    timeout-minutes: 15
    env:
      DATABASE_URL: mongodb://localhost:27017/test
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      DEFAULT_TENANT_SLUG: default
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull MongoDB image with retries
        run: |
          for i in 1 2 3 4 5; do
            if docker pull mongo:7; then
              echo "Successfully pulled mongo:7"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Start MongoDB service
        run: docker run -d --name mongodb -p 27017:27017 mongo:7

      - name: Wait for MongoDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:int:coverage
        env:
          USE_MONGO_SERVICE: 'true'

      - name: Upload integration coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-int
          path: coverage/
          retention-days: 3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fast-gate]
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: mongodb://localhost:27017/test
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}
      NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL || 'http://localhost:3000' }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull MongoDB image with retries
        run: |
          for i in 1 2 3 4 5; do
            if docker pull mongo:7; then
              echo "Successfully pulled mongo:7"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Start MongoDB service
        run: docker run -d --name mongodb -p 27017:27017 mongo:7

      - name: Wait for MongoDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache .next build
        uses: actions/cache@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build application
        run: pnpm build

  e2e-gate:
    name: E2E Gate (PR → main)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'dev' && needs.build.result == 'success'
    timeout-minutes: 20
    env:
      DATABASE_URL: mongodb://localhost:27017/test
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      DEFAULT_TENANT_SLUG: default
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_BRAND: aguy
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore .next build from cache
        uses: actions/cache/restore@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull MongoDB image with retries
        run: |
          for i in 1 2 3 4 5; do
            if docker pull mongo:7; then
              echo "Successfully pulled mongo:7"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Start MongoDB service
        run: docker run -d --name mongodb -p 27017:27017 mongo:7

      - name: Wait for MongoDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests (E2E gate)
        run: pnpm exec playwright test --config=playwright.e2e-gate.config.ts
        env:
          USE_MONGO_SERVICE: 'true'
          SKIP_BUILD: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-gate
          path: playwright-report/
          retention-days: 3

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-e2e-gate
          path: test-results/
          retention-days: 3

  e2e-system-tests:
    name: E2E System Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_tests == true && needs.build.result == 'success'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      DATABASE_URL: mongodb://localhost:27017/test
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      DEFAULT_TENANT_SLUG: default
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore .next build from cache
        if: needs.build.result == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull MongoDB image with retries
        run: |
          for i in 1 2 3 4 5; do
            if docker pull mongo:7; then
              echo "Successfully pulled mongo:7"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Start MongoDB service
        run: docker run -d --name mongodb -p 27017:27017 mongo:7

      - name: Wait for MongoDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test --config=playwright.config.ts --shard=${{ matrix.shard }}
        env:
          USE_MONGO_SERVICE: 'true'
          SKIP_BUILD: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 3

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 3

  qa-scenarios-core:
    name: QA Scenarios (core)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e_tests == true && needs.build.result == 'success'
    timeout-minutes: 20
    env:
      DATABASE_URL: mongodb://localhost:27017/test
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      DEFAULT_TENANT_SLUG: default
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore .next build from cache
        uses: actions/cache/restore@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull MongoDB image with retries
        run: |
          for i in 1 2 3 4 5; do
            if docker pull mongo:7; then
              echo "Successfully pulled mongo:7"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Start MongoDB service
        run: docker run -d --name mongodb -p 27017:27017 mongo:7

      - name: Wait for MongoDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Validate scenarios
        run: pnpm test:qa:validate

      - name: Run QA core scenarios
        run: pnpm exec playwright test --project=qa-core
        env:
          USE_MONGO_SERVICE: 'true'
          SKIP_BUILD: 'true'

  qa-scenarios-full:
    name: QA Scenarios (full)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    timeout-minutes: 30
    env:
      DATABASE_URL: mongodb://localhost:27017/test
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'test-secret-for-ci' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      DEFAULT_TENANT_SLUG: default
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore .next build from cache
        uses: actions/cache/restore@v4
        with:
          path: .next
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-pull MongoDB image with retries
        run: |
          for i in 1 2 3 4 5; do
            if docker pull mongo:7; then
              echo "Successfully pulled mongo:7"
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Start MongoDB service
        run: docker run -d --name mongodb -p 27017:27017 mongo:7

      - name: Wait for MongoDB to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --eval 'db.runCommand({ ping: 1 })' &>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | head -1)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Validate scenarios
        run: pnpm test:qa:validate

      - name: Run QA full scenarios
        run: pnpm exec playwright test --project=qa-full
        env:
          USE_MONGO_SERVICE: 'true'
          SKIP_BUILD: 'true'
